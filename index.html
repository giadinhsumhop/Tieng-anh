['⏰','Present simple & present continuous',`<ul><li><b>Present simple</b> (thói quen, sự thật): S + V(s/es). She <i>goes</i> to school every day. Phủ định: don't / doesn't + V. Dấu hiệu: always, usually, often, every day.</li><li><b>Present continuous</b> (đang xảy ra): S + am/is/are + V-ing. I <i>am studying</i> now. Dấu hiệu: now, at the moment, Look!</li></ul><p class="tip">💡 Động từ chỉ trạng thái (like, know, love) thường không chia ở tiếp diễn.</p>`],
['⏪','Past simple & past continuous',`<ul><li><b>Past simple</b>: S + V-ed / V2. I <i>visited</i> Hue last year. Phủ định: didn't + V. Dấu hiệu: yesterday, ago, last week.</li><li><b>Past continuous</b>: S + was/were + V-ing, chỉ hành động đang diễn ra ở một thời điểm hoặc bị cắt ngang: I <i>was reading</i> when he <i>called</i>.</li></ul><p class="tip">💡 While + hành động dài (past continuous), when + hành động ngắn (past simple).</p>`],
['✅','Present perfect',`<p>S + have/has + V3. Dùng cho trải nghiệm hoặc việc bắt đầu trong quá khứ và còn liên quan đến hiện tại.</p><ul><li>I <i>have lived</i> here <b>for</b> five years / <b>since</b> 2019.</li><li>Dấu hiệu: already, yet, just, ever, never.</li><li>Có mốc quá khứ rõ ràng (in 2020, yesterday) thì dùng past simple.</li></ul><p class="tip">💡 for + khoảng thời gian, since + mốc thời gian.</p>`],
['🔮','Tương lai: will & be going to',`<ul><li><b>will</b>: quyết định tức thời, dự đoán, lời hứa. I <i>will</i> help you.</li><li><b>be going to</b>: kế hoạch đã có hoặc có dấu hiệu rõ. I <i>am going to</i> visit my aunt.</li><li>Present continuous cho lịch hẹn chắc chắn: We are meeting at 5.</li></ul>`],
['⚖️','So sánh hơn và so sánh nhất',`<ul><li>Tính từ ngắn: tall → taller → the tallest. Gấp đôi phụ âm: big → bigger. y → ier: happy → happier.</li><li>Tính từ dài: beautiful → more beautiful → the most beautiful.</li><li>Bất quy tắc: good → better → the best; bad → worse → the worst.</li><li>So sánh bằng: as + adj + as.</li></ul><p class="tip">💡 So sánh hơn đi với <b>than</b>, so sánh nhất có <b>the</b>.</p>`],
['🧭','Modal verbs',`<ul><li><b>can / could</b>: khả năng. <b>may / might</b>: có thể xảy ra.</li><li><b>should</b>: lời khuyên. <b>must</b>: bắt buộc. <b>mustn't</b>: cấm.</li><li><b>have to</b>: cần thiết. <b>don't have to</b>: không cần.</li></ul><p class="tip">💡 Sau modal là động từ nguyên mẫu không "to", không thêm s.</p>`],
['🌈','Câu điều kiện & wish',`<ul><li><b>Loại 1</b> (có thể xảy ra): If + present simple, will + V. If it rains, we <i>will stay</i> home.</li><li><b>Loại 2</b> (không có thật ở hiện tại): If + past simple, would + V. If I <i>were</i> you, I <i>would study</i> harder.</li><li><b>Wish</b> + past simple: I wish I <i>had</i> a bike.</li></ul><p class="tip">💡 Trong câu điều kiện loại 2 và wish, dùng <b>were</b> cho mọi ngôi.</p>`],
['🔁','Câu bị động',`<p>S + be + V3 (+ by ...). Tân ngữ của câu chủ động thành chủ ngữ.</p><ul><li>Present simple: am/is/are + V3. English <i>is spoken</i> worldwide.</li><li>Past simple: was/were + V3. The window <i>was broken</i>.</li><li>Present perfect: has/have been + V3. Will: will be + V3.</li></ul>`],
['💬','Câu tường thuật',`<ul><li>Lùi thì: am/is → was/were; present simple → past simple; will → would; can → could.</li><li>Đổi đại từ, trạng từ: now → then, today → that day, tomorrow → the next day, here → there.</li><li>"I like pizza," she said → She said (that) she <i>liked</i> pizza.</li><li>Câu hỏi: asked + if / từ hỏi + S + V (không đảo): She asked me where I lived.</li></ul>`],
['🔗','Mệnh đề quan hệ',`<ul><li><b>who</b> (người), <b>which</b> (vật), <b>that</b> (người hoặc vật), <b>whose</b> (sở hữu), <b>where</b> (nơi chốn).</li><li>The girl <i>who</i> lives next door is my friend.</li><li>The book <i>which</i> I bought is great.</li></ul><p class="tip">💡 Không dùng that sau dấu phẩy hoặc sau giới từ.</p>`],
